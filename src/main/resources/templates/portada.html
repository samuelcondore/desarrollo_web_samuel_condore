<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: head_base}"></th:block>
    <title> Portada </title>
</head>

<body>
<div th:replace="~{base :: navbar}"></div>
<div th:replace="~{base :: flash_messages}"></div>
    <h1>Mensaje de bienvenida</h1>
    <table th:if="${data != null and !data.isEmpty()}">
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Fecha de registro</th>
            <th>Comuna</th>
        </tr>
        <tr th:each="miembro : ${data}">
            <td th:text="${miembro.nombre}">nombre</td>
            <td th:text="${miembro.email}">email</td>
            <td th:text="${miembro.telefono}">telefono </td>
            <td th:text="${miembro.fecha_registro}">fecha_registro</td>
            <td th:text="${miembro.comuna.nombre}">comuna</td>
        </tr>
    </table>
    <p th:if="${data == null or data.isEmpty()}" style="color: red;">No se encontraron miembros</p>

<script th:replace="~{base :: script_base}"></script>
</body>
</html>
