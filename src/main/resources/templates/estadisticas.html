<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: head_base}"></th:block>
    <title> Estadisticas </title>
    <link rel="stylesheet" th:href="@{css/comments.css}">
    <script src="https://code.highcharts.com/highcharts.js"></script>
</head>

<body>
<div th:replace="~{base :: navbar}"></div>
<div th:replace="~{base :: flash_messages}"></div>

<h1>Gráficas con estadísticas</h1>
<label for="rango"></label>
<select name="rango" id="rango">
    <option value="7">1 Semana</option>
    <option value="31" selected>1 Mes</option>
    <option value="63">3 Meses</option>
    <option value="186">6 Meses</option>
    <option value="365">1 Año</option>
</select>
<div id="linechart" style="width:100%; height:400px;"></div>

<div id="piechart" style="width:100%; height:400px;"></div>

<div id="barchart" style="width:100%; height:400px;"></div>


<script th:src="@{/js/estadisticas.js}"></script>
<script th:replace="~{base :: script_base}"></script>
</body>
</html>
