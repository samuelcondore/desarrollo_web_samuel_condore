<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{base :: head_base}"></th:block>
    <title> Listado </title>
</head>
<body>
<div th:replace="~{base :: navbar}"></div>
<div th:replace="~{base :: flash_messages}"></div>
<div>
    <table th:if="${data != null and !data.isEmpty()}">
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Nombre Actividad</th>
            <th>Día</th>
            <th>Hora inicio</th>
        </tr>
        <tr th:each="act : ${data}" th:id="${actStat.count}" th:attr="data-id=${act.miembro.id}">
            <td th:text="${act.miembro.nombre}">nombre_miembro</td>
            <td th:text="${act.miembro.email}">email</td>
            <td th:text="${act.nombre}">nombre_act</td>
            <td th:text="${act.dia}">dia</td>
            <td th:text="${act.hora_inicio}">horai</td>
        </tr>
    </table>
    <br><br><br><br>
        <a th:if="${has_prev}" class="paginator" th:href="@{/listado(page=${curr_page - 1})}">previa</a>
        <a th:if="${has_next}" class="paginator" th:href="@{/listado(page=${curr_page + 1})}">siguiente</a>
</div>
<p th:if="${data == null or data.isEmpty()}" style="color: red;">No se encontraron actividades</p>

<script th:src="@{/js/listado.js}"></script>
<script th:replace="~{base :: script_base}"></script>
</body>
</html>
